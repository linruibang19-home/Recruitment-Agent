<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>招聘 Agent 执行器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="mark">招</span>
        <div>
          <strong>招聘 Agent 执行器</strong>
          <small>采集与固定话术</small>
        </div>
      </header>
      <section>
        <span id="dot" class="dot"></span>
        <div>
          <strong id="status">正在检测...</strong>
          <p id="detail">请保持本地后端和 BOSS 页面打开。</p>
        </div>
      </section>
      <button id="dashboard" type="button">打开招聘工作台</button>
      <p class="safety">默认只采集；仅在控制台显式触发时发送固定索要简历话术。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
